<div class="wrap">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="1" y="1" width="46" height="46" fill="none" stroke="#1F2328" stroke-width="2"/><path d="M7 24c5-7.5 11-11 17-11s12 3.5 17 11c-5 7.5-11 11-17 11S12 31.5 7 24z" fill="none" stroke="#1F2328" stroke-width="2"/><circle cx="27" cy="24" r="6" fill="none" stroke="#1E3F8F" stroke-width="2"/><circle cx="27" cy="24" r="2.4" fill="#1F2328"/></svg>
      <div><h1>Oculomotor</h1><p data-i18n="hdr.sub"></p></div>
    </div>
    <div style="justify-self:end"><select id="langSel" data-i18n-aria-label="hdr.lang_aria" style="width:auto"></select></div>
    <div class="status" id="status"></div>
    <nav class="tabs" role="tablist" data-i18n-aria-label="hdr.nav_aria">
      <button role="tab" id="tab-sim" data-tab="sim" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12c3-5 6.5-7.5 10-7.5S19 7 22 12c-3 5-6.5 7.5-10 7.5S5 17 2 12z"/><circle cx="12" cy="12" r="3.2"/></svg><span data-i18n="hdr.tab.sim"></span></button>
      <button role="tab" id="tab-anat" data-tab="anat" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span data-i18n="hdr.tab.anat"></span></button>
      <button role="tab" id="tab-dx" data-tab="dx" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4h6M10 4v5l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V4"/><path d="M8 15h8"/></svg><span data-i18n="hdr.tab.dx"></span></button>
    </nav>
  </header>

<main>
  <!-- ====================== SIMULADOR ====================== -->
  <section id="view-sim">
    <div class="grid">
      <div class="col col-l">
        <div class="card">
          <h2><span data-i18n="sim.lesion"></span> <small data-i18n="sim.lesion_sub"></small></h2>
          <div id="lesionLock" class="lock" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span data-i18n="sim.lock"></span></div>
          <div id="lesionCtl">
            <div id="eyectl-R" class="eyectl"></div>
            <div id="eyectl-L" class="eyectl"></div>
            <div class="eyectl">
              <div class="eyehead"><b data-i18n="sim.syn"></b><span data-i18n="sim.both_eyes"></span></div>
              <select id="synSel" data-i18n-aria-label="sim.syn"></select>
              <div class="seg" id="synSide"><button data-v="R" aria-pressed="true" data-i18n="sim.syn_side.R"></button><button data-v="L" aria-pressed="false" data-i18n="sim.syn_side.L"></button></div>
              <div class="row"><label for="synSev" data-i18n="sim.severity"></label><input type="range" id="synSev" min="10" max="100" step="5" value="100"><output id="synSevO">100 %</output></div>
            </div>
          </div>
        </div>
        <div class="card">
          <h2><span data-i18n="sim.exam"></span></h2>
          <div class="ctlblock">
            <span class="lbl" data-i18n="sim.gaze"></span>
            <div class="btnrow">
              <button class="btn primary" id="btnH" data-i18n="sim.h"></button>
              <button class="btn" id="btnCenter" data-i18n="sim.primary"></button>
              <button class="btn" id="btnConv" aria-pressed="false" data-i18n="sim.conv"></button>
            </div>
          </div>
          <div class="ctlblock">
            <span class="lbl" data-i18n="sim.fixing"></span>
            <div class="seg" data-bind="fix"><button data-v="R" aria-pressed="false" data-i18n="sim.fix.R"></button><button data-v="L" aria-pressed="true" data-i18n="sim.fix.L"></button></div>
          </div>
          <div class="ctlblock">
            <span class="lbl" data-i18n="sim.cover"></span>
            <div class="seg" data-bind="cover"><button data-v="" aria-pressed="true" data-i18n="sim.cover_none"></button><button data-v="R" aria-pressed="false" data-i18n="sim.cover_eye.R"></button><button data-v="L" aria-pressed="false" data-i18n="sim.cover_eye.L"></button></div>
          </div>
          <div class="ctlblock">
            <span class="lbl" data-i18n="sim.head"></span>
            <div class="row"><label for="tilt" data-i18n="sim.tilt"></label><input type="range" id="tilt" min="-35" max="35" step="1" value="0"><output id="tiltO">0°</output></div>
            <div class="row"><label for="yaw" data-i18n="sim.yaw"></label><input type="range" id="yaw" min="-30" max="30" step="1" value="0"><output id="yawO">0°</output></div>
            <div class="btnrow">
              <button class="btn" id="btnComp" data-i18n="sim.comp"></button>
              <button class="btn" id="btnHeadReset" data-i18n="sim.head_reset"></button>
            </div>
          </div>
          <div class="ctlblock">
            <label class="row" style="gap:8px;cursor:pointer;align-items:flex-start"><input type="checkbox" id="lift" checked style="margin-top:2px"> <span style="font-size:12.5px;color:var(--ink);white-space:normal" data-i18n="sim.lift"></span></label>
          </div>
        </div>
      </div>

      <div class="col col-m">
        <div class="card stage raised">
          <div class="stagebar">
            <b data-i18n-html="sim.inspect"></b>
            <span class="hint" data-i18n="sim.hint"></span>
            <button class="btn sm primary" id="btnCamTop" data-i18n="cam.activate"></button><button class="btn sm" id="goAnat" data-i18n="sim.go_anat"></button>
          </div>
          <div class="facehost" id="host-face"><canvas class="face" id="face" data-i18n-aria-label="sim.face_aria"></canvas></div>
          <div class="readouts">
            <div class="ro"><div class="k" data-i18n="sim.ro_h"></div><div class="v" id="roH">—</div><div class="s" id="roHs">—</div></div>
            <div class="ro"><div class="k" data-i18n="sim.ro_v"></div><div class="v" id="roV">—</div><div class="s" id="roVs">—</div></div>
            <div class="ro"><div class="k" data-i18n="sim.ro_t"></div><div class="v" id="roT">—</div><div class="s" id="roTs">—</div></div>
            <div class="ro"><div class="k" data-i18n="sim.ro_p"></div><div class="v" id="roP">—</div><div class="s" id="roPs">—</div></div>
          </div>
        </div>
        <div class="card">
          <h2><span data-i18n="sim.nine"></span> <small data-i18n="sim.nine_sub"></small></h2>
          <canvas class="nine" id="nine" data-i18n-aria-label="sim.nine_aria"></canvas>
        </div>
        <div class="card" id="interpCard">
          <h2><span data-i18n="sim.interp"></span></h2>
          <div class="findings" id="findings"></div>
          <div class="clin" id="clin"></div>
        </div>
      </div>

      <div class="col col-r">
        <div id="simCamSlot"><div class="card" id="camCard">
          <h2><span data-i18n="cam.title"></span> <small data-i18n="cam.sub"></small></h2>
          <div class="camwrap"><video id="camVideo" playsinline muted></video><canvas id="camOverlay"></canvas><div class="camidle" id="camIdle" data-i18n="cam.idle"></div></div>
          <div class="btnrow" style="margin-top:10px"><button class="btn primary" id="btnCam" data-i18n="cam.follow"></button><select id="camMode" data-i18n-aria-label="cam.mode_aria" style="width:auto"><option value="hand" data-i18n="cam.mode_hand"></option><option value="color" data-i18n="cam.mode_color"></option></select></div>
          <div class="row" style="margin-top:8px"><label for="camRange" data-i18n="cam.range"></label><input type="range" id="camRange" min="20" max="50" value="35"><output id="camRangeO">35°</output></div>
          <label class="row" style="cursor:pointer;margin-top:4px"><input type="checkbox" id="camConv" checked> <span style="font-size:12.5px;color:var(--ink);white-space:normal" data-i18n="cam.conv"></span></label>
          <div class="camdiag" id="camDiag"></div>
          <div class="note" id="camStatus" style="margin-top:8px;color:var(--pen);font-size:13px" role="status" aria-live="polite"></div>
        </div>
        </div>
        <div class="card">
          <h2><span data-i18n="sim.patient"></span> <small data-i18n="sim.patient_sub"></small></h2>
          <canvas class="patient" id="patient" data-i18n-aria-label="sim.patient_aria"></canvas>
          <div class="note" id="dipNote" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ====================== ANATOMÍA ====================== -->
  <section id="view-anat" hidden>
    <div class="anat">
      <div>
        <div class="viewport" id="host-main"><div class="v3msg" data-i18n="anat.loading"></div>
          <div class="vtool" id="vtool">
            <button class="vbtn" data-view="front" data-i18n="anat.view.front"></button>
            <button class="vbtn" data-view="top" data-i18n="anat.view.top"></button>
            <button class="vbtn" data-view="side" data-i18n="anat.view.side"></button>
            <button class="vbtn" data-view="back" data-i18n="anat.view.back"></button>
            <button class="vbtn" id="btnMove" aria-pressed="false" data-i18n="anat.move" data-i18n-title="anat.move_title"></button>
            <button class="vbtn" id="btnColor" aria-pressed="false" data-i18n="anat.color"></button>
          </div>
          <div class="vfoot">
            <div class="explode"><b data-i18n="anat.explode"></b><input type="range" id="explode" min="0" max="100" value="0" data-i18n-aria-label="anat.explode_aria"><button class="vbtn" id="btnReassemble" data-i18n="anat.reassemble"></button></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card info" id="infoCard">
          <div class="type" id="infoType" data-i18n="anat.sel_type"></div>
          <h3 id="infoName" data-i18n="anat.sel_name"></h3>
          <div id="infoBody" class="note" style="margin-top:6px" data-i18n="anat.sel_body"></div>
          <div class="btnrow" style="margin-top:12px">
            <button class="btn sm" id="btnIsolate" disabled data-i18n="anat.isolate"></button>
            <button class="btn sm" id="btnHide" disabled data-i18n="anat.hide"></button>
            <button class="btn sm" id="btnShowAll" data-i18n="anat.show_all"></button>
          </div>
        </div>
        <div class="card">
          <h2><span data-i18n="anat.layers"></span></h2>
          <div class="layers" id="layers"></div>
          <div class="ctlblock" style="margin-top:12px">
            <span class="lbl" data-i18n="anat.labels"></span>
            <div class="seg" id="segLabels"><button data-v="none" aria-pressed="false" data-i18n="anat.lab_none"></button><button data-v="key" aria-pressed="true" data-i18n="anat.lab_key"></button><button data-v="all" aria-pressed="false" data-i18n="anat.lab_all"></button></div>
          </div>
          <div class="ctlblock">
            <span class="lbl" id="lblSkin" data-i18n="anat.skin"></span>
            <div class="seg" id="segSkin" role="group" aria-labelledby="lblSkin"></div>
          </div>
        </div>
        <div class="card">
          <h2><span data-i18n="anat.motion"></span> <small data-i18n="anat.motion_sub"></small></h2>
          <div class="dragpad" id="dragpad3d" data-i18n-aria-label="anat.drag_aria"><span class="dp-dot" id="dp-dot"></span><span class="dp-lbl" data-i18n="anat.drag"></span></div>
          <div class="gazepad" id="gazepad3d" style="margin-top:10px"></div>
          <div class="btnrow" style="margin-top:10px"><button class="btn sm primary" id="btnH3d" data-i18n="sim.h"></button><button class="btn sm" id="btnGoSim" data-i18n="anat.change"></button></div>
          <div class="note" style="margin-top:8px" id="anatLesion"></div>
        </div>
        <div id="anatCamSlot"></div>
      </div>
    </div>
  </section>

  <!-- ====================== DIAGNÓSTICO ====================== -->
  <section id="view-dx" hidden>
    <div class="subtabs" id="dxTabs">
      <button data-v="case" aria-pressed="true" data-i18n="dx.tab.case"></button>
      <button data-v="parks" data-i18n="dx.tab.parks"></button>
      <button data-v="tree" data-i18n="dx.tab.tree"></button>
      <button data-v="edit" data-i18n="dx.tab.edit"></button>
    </div>
    <div class="dx">
      <div id="dxMain" class="card"></div>
      <aside class="dx-side" id="dxSide">
        <div class="card stage raised">
          <div class="stagebar"><b data-i18n="dx.explore"></b><span class="hint" data-i18n="dx.hint"></span></div>
          <div class="facehost sm" id="host-face2"><canvas class="face" id="face2" data-i18n-aria-label="dx.face_aria"></canvas></div>
          <div style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">
            <div class="examline" id="examLine">—</div>
            <div class="examctl">
              <div class="gazepad" id="gazepad2" style="width:150px"></div>
              <div class="ctlblock" style="gap:6px">
                <span class="lbl" data-i18n="dx.tilt"></span>
                <div class="seg" id="tiltSeg2"><button data-v="-25" data-i18n="dx.tilt_l"></button><button data-v="0" aria-pressed="true" data-i18n="dx.tilt_0"></button><button data-v="25" data-i18n="dx.tilt_r"></button></div>
                <span class="lbl" data-i18n="dx.cover"></span>
                <div class="seg" data-bind="cover"><button data-v="" aria-pressed="true" data-i18n="dx.no"></button><button data-v="R" aria-pressed="false" data-i18n="eye.R"></button><button data-v="L" aria-pressed="false" data-i18n="eye.L"></button></div>
                <span class="lbl" data-i18n="dx.fix"></span>
                <div class="seg" data-bind="fix"><button data-v="R" aria-pressed="false" data-i18n="eye.R"></button><button data-v="L" aria-pressed="true" data-i18n="eye.L"></button></div>
              </div>
            </div>
            <div class="btnrow"><button class="btn sm" id="btnConv2" aria-pressed="false" data-i18n="sim.conv"></button><button class="btn sm" id="btnH2" data-i18n="sim.h"></button></div>
          </div>
        </div>
        <div class="card">
          <h2><span data-i18n="sim.patient"></span></h2>
          <canvas class="patient" id="patient2" data-i18n-aria-label="dx.patient_aria"></canvas>
        </div>
      </aside>
    </div>
  </section>


</main>

  <footer>
    <p data-i18n-html="foot.p1"></p>
    <p data-i18n-html="foot.p2"></p>
    <p data-i18n-html="foot.p3"></p>
  </footer>
</div>
