<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doc Ramiro · Materiales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--paper:#FCFCF8;--desk:#ECECE6;--ink:#1F2328;--rule:#C9D1DB;--pen:#1E3F8F;--muted:#5E646C}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.sheet{max-width:880px;margin:24px auto;background:var(--paper);padding:28px 24px 40px;box-shadow:0 12px 40px rgba(31,35,40,.08)}
@media (max-width:640px){.sheet{margin:0}}
h1{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:28px;letter-spacing:.04em;text-transform:uppercase;margin:0;border-bottom:2px solid var(--ink);padding-bottom:10px}
p.sub{color:var(--muted);margin:8px 0 26px}
a.item{display:block;border:1.5px solid var(--ink);text-decoration:none;color:var(--ink);position:relative;padding:34px 16px 16px}
a.item:hover{background:#EEF1F6}
a.item .lb{position:absolute;top:-1px;left:-1px;background:var(--ink);color:var(--paper);font:600 11px "IBM Plex Sans Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px}
a.item b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
a.item span{display:block;margin-top:4px;color:var(--muted)}
a.item code{display:block;margin-top:10px;font-family:"IBM Plex Mono",monospace;color:var(--pen);font-size:13px}
</style>
</head>
<body>
<div class="sheet">
  <h1>Doc Ramiro</h1>
  <p class="sub">Materiales interactivos de neurología y educación médica.</p>
  <a class="item" href="oculomotor/"><span class="lb">Simulador</span><b>Oculomotor</b><span>Motilidad ocular y parálisis de los pares III, IV y VI: rostro 3D, anatomía de ambas órbitas, casos clínicos y algoritmo de diplopía.</span><code>/oculomotor</code></a>
</div>
</body>
</html>
