<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doc Ramiro · Materiales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--paper:#FCFCF8;--desk:#ECECE6;--ink:#1F2328;--rule:#C9D1DB;--pen:#1E3F8F;--muted:#5E646C}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
.sheet{max-width:880px;margin:24px auto;background:var(--paper);padding:28px 24px 40px;box-shadow:0 12px 40px rgba(31,35,40,.08)}
@media (max-width:640px){.sheet{margin:0}}
h1{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:28px;letter-spacing:.04em;text-transform:uppercase;margin:0;border-bottom:2px solid var(--ink);padding-bottom:10px}
p.sub{color:var(--muted);margin:8px 0 26px}
a.item{display:block;border:1.5px solid var(--ink);text-decoration:none;color:var(--ink);position:relative;padding:34px 16px 16px}
a.item:hover{background:#EEF1F6}
a.item .lb{position:absolute;top:-1px;left:-1px;background:var(--ink);color:var(--paper);font:600 11px "IBM Plex Sans Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px}
a.item b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
a.item span{display:block;margin-top:4px;color:var(--muted)}
a.item code{display:block;margin-top:10px;font-family:"IBM Plex Mono",monospace;color:var(--pen);font-size:13px}
</style>
</head>
<body>
<div class="sheet">
  <h1>Doc Ramiro</h1>
  <p class="sub" data-i18n="sub">Materiales interactivos de neurología y educación médica.</p>
  <a class="item" href="oculomotor/"><span class="lb" data-i18n="tag">Simulador</span><b>Oculomotor</b><span data-i18n="desc">Motilidad ocular y parálisis de los pares III, IV y VI: rostro 3D, anatomía de ambas órbitas, casos clínicos y algoritmo de diplopía.</span><code>/oculomotor</code></a>
</div>
<script>
/* Same language choice as the simulator (?lang=, then the stored choice, then the browser); Spanish is the markup itself. */
(function(){
  var T={
    en:{title:'Doc Ramiro · Materials',sub:'Interactive materials for neurology and medical education.',tag:'Simulator',desc:'Eye motility and palsies of cranial nerves III, IV and VI: 3D face, anatomy of both orbits, clinical cases and a diplopia algorithm.'},
    fr:{title:'Doc Ramiro · Ressources',sub:'Ressources interactives de neurologie et de pédagogie médicale.',tag:'Simulateur',desc:'Motilité oculaire et paralysies des nerfs crâniens III, IV et VI : visage 3D, anatomie des deux orbites, cas cliniques et algorithme de diplopie.'}
  };
  var ok=function(l){return l==='es'||Object.prototype.hasOwnProperty.call(T,l);}, l=null;
  try{l=new URLSearchParams(location.search).get('lang');}catch(e){}
  if(!ok(l)){try{l=localStorage.getItem('oculo-lang');}catch(e){}}
  if(!ok(l))l=(navigator.languages||[navigator.language||'']).map(function(x){return String(x).slice(0,2).toLowerCase();}).filter(ok)[0];
  if(!ok(l)||l==='es')return;
  document.documentElement.lang=l; document.title=T[l].title;
  document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=T[l][e.getAttribute('data-i18n')];});
})();
</script>
</body>
</html>
